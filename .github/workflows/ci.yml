name: CI

# Called by deploy.yml (push to main, pull requests) so tests always gate the
# Vercel deployment; can also be run on its own from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

env:
  FOUNDRY_VERSION: v1.7.1
  NODE_VERSION: "22"
  # package-lock.json is written by npm 11; Node 22's bundled npm 10 resolves some
  # optional/peer deps differently and `npm ci` then rejects the lockfile.
  NPM_VERSION: "11.6.1"

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge build --sizes
      - run: forge test

  # Báo cáo, chưa chặn deploy: bật chặn sau khi đã xử lý các cảnh báo hiện có.
  security:
    name: Security scan (Slither, npm audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Slither
        uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high
          # Bỏ thư viện ngoài. arbitrary-send-eth chỉ báo Marketplace._release gửi ETH tới
          # PaymentSplitter do owner đặt, với đúng số tiền người mua đã trả.
          slither-args: --filter-paths lib/ --exclude arbitrary-send-eth
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src test e2e
      - run: npm test

  e2e:
    name: E2E (Playwright + Anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compile contracts
        working-directory: contracts
        run: forge build
      # Builds the app for Anvil (NEXT_PUBLIC_CHAIN_ID=31337), starts Anvil,
      # deploys with script/Deploy.s.sol and runs e2e/tests (retries ≤ 1).
      - name: Run E2E suite
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report
          retention-days: 14
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: |
            frontend/e2e/coverage
            frontend/e2e/assets
          retention-days: 14
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/e2e/test-results
          retention-days: 7
