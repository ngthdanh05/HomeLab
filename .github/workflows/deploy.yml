name: CI / Deploy

# push to main  → tests (contracts, frontend, E2E) → Vercel production deploy
# pull request  → tests → Vercel preview deploy, URL commented on the PR
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
# (see docs/DEPLOYMENTS.md). Without them (e.g. PRs from forks) the tests still
# run and the deploy job is skipped with a notice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NPM_VERSION: "11.6.1"
  VERCEL_CLI: vercel@65.12.1

jobs:
  ci:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Vercel (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.smoke.outputs.url || steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets are not set; skipping deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm ${{ env.NPM_VERSION }}
        if: steps.secrets.outputs.ok == 'true'
        run: npm install -g npm@${{ env.NPM_VERSION }}

      # Pulls the project settings and the environment variables set on Vercel
      # (GEMINI_API_KEY, PINATA_JWT, NEXT_PUBLIC_*), so the build uses them.
      - name: Pull Vercel environment
        if: steps.secrets.outputs.ok == 'true'
        run: npx -y ${{ env.VERCEL_CLI }} pull --yes --environment=$TARGET --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: npx -y ${{ env.VERCEL_CLI }} build ${{ env.TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(npx -y ${{ env.VERCEL_CLI }} deploy --prebuilt ${{ env.TARGET == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        id: smoke
        if: steps.secrets.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        # Vercel Deployment Protection covers every deployment URL
        # (myhomelab-<hash>-….vercel.app, production included): they answer 302 to
        # the Vercel login. Only the production domain is public. So:
        #   - the deployment must be READY (Vercel REST API with the team id;
        #     `vercel inspect` / `vercel curl` fail with "User not found" for a
        #     team-scoped token);
        #   - production: its first alias (the production domain) must point at this
        #     deployment, and every page there must return 200 + render the home page;
        #   - preview: each URL must answer 200 or the protection redirect.
        run: |
          api() { curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1?teamId=$VERCEL_ORG_ID"; }
          host=${URL#https://}
          deployment=$(api "/v13/deployments/$host") || { echo "::error::could not read the deployment from the Vercel API"; exit 1; }
          id=$(jq -r '.id' <<<"$deployment")
          state=$(jq -r '.readyState // "UNKNOWN"' <<<"$deployment")
          echo "deployment $host ($id) -> $state"
          [ "$state" = "READY" ] || { echo "::error::deployment is $state, not READY"; exit 1; }

          base=$URL
          if [ "$TARGET" = "production" ]; then
            domain=$(jq -r '.alias[0] // empty' <<<"$deployment")
            [ -n "$domain" ] || { echo "::error::production deployment has no alias"; exit 1; }
            served=$(api "/v13/deployments/$domain" | jq -r '.id') || { echo "::error::could not resolve $domain"; exit 1; }
            echo "production domain $domain -> $served"
            [ "$served" = "$id" ] || { echo "::error::$domain still serves $served, not $id"; exit 1; }
            base=https://$domain
          fi
          echo "url=$base" >> "$GITHUB_OUTPUT"

          for path in / /marketplace /governance /sitemap.xml /robots.txt; do
            result=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --retry 3 --retry-delay 5 "$base$path")
            code=${result%% *}
            echo "$path -> $result"
            if [ "$code" = "200" ]; then continue; fi
            if [ "$TARGET" != "production" ] && [ "$code" = "302" ] && [[ "$result" == *"vercel.com/sso-api"* ]]; then continue; fi
            echo "::error::$path returned $code"; exit 1
          done
          if [ "$TARGET" = "production" ]; then
            curl -sf "$base/" | grep -q "MyHomeLab" || { echo "::error::home page content missing"; exit 1; }
          fi

      # Smoke test thất bại trên production: quay lại bản trước.
      - name: Roll back production
        if: failure() && steps.deploy.outcome == 'success' && env.TARGET == 'production'
        run: npx -y ${{ env.VERCEL_CLI }} rollback --yes --token="$VERCEL_TOKEN"

      - name: Comment preview URL on the PR
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n🔍 **Preview deployment:** ${process.env.URL}\n\nCommit \`${context.sha.slice(0, 7)}\` · tests passed (contracts, frontend, E2E).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
